# ─── Fly.io Configuration ────────────────────────────────────────────
# Deploy: fly launch → fly deploy
# Docs: https://fly.io/docs/reference/configuration/

app = "ig-group-sharing"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  LOG_LEVEL = "INFO"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "ig_data"
  destination = "/data"

